name: Daily ETF ingest

on:
  schedule:
    # Normal run: small overlapping window after each US trading day.
    - cron: '0 21 * * 1-5'
    # Monthly reconciliation: refresh the full supported history so dividend
    # and split adjustments made by the vendor propagate to older rows.
    - cron: '30 21 1 * *'
  workflow_dispatch:
    inputs:
      dbt_only:
        description: Rebuild cloud marts from existing raw data without fetching prices
        required: false
        default: false
        type: boolean
      fetch_period:
        description: Yahoo history window (ignored when dbt_only=true)
        required: false
        default: 1mo
        type: choice
        options:
          - 1mo
          - 10y

permissions:
  contents: read

concurrency:
  group: daily-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Scheduled ingest is warehouse-backed. Repository parquet is a bundled
    # fallback snapshot and is intentionally not mutated by automation.
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'etf_analytics' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'etf' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_SSLMODE: ${{ secrets.POSTGRES_SSLMODE || 'require' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ingest/requirements.txt
            airflow/requirements.txt

      - name: Validate cloud warehouse configuration
        run: |
          if [ -z "$POSTGRES_HOST" ] || [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::POSTGRES_HOST and POSTGRES_PASSWORD are required for scheduled ingest"
            exit 1
          fi

      - name: Select fetch window
        id: fetch_window
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          REQUESTED_PERIOD: ${{ inputs.fetch_period }}
        run: |
          period="1mo"
          if [ "$SCHEDULE_EXPRESSION" = "30 21 1 * *" ]; then
            period="10y"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$REQUESTED_PERIOD" ]; then
            period="$REQUESTED_PERIOD"
          fi

          case "$period" in
            1mo|10y) ;;
            *) echo "::error::Unsupported fetch period: $period"; exit 1 ;;
          esac

          echo "period=$period" >> "$GITHUB_OUTPUT"
          echo "Selected Yahoo fetch window: $period"

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.dbt_only != true
        run: pip install -r ingest/requirements.txt

      - name: Fetch prices and upsert cloud warehouse
        if: github.event_name != 'workflow_dispatch' || inputs.dbt_only != true
        run: python ingest/fetch_prices.py
        env:
          # fetch_prices keeps its local raw-file contract, but CI writes outside
          # the checkout so the repository remains code-only.
          RAW_DATA_DIR: ${{ runner.temp }}/etf-raw
          FETCH_PERIOD: ${{ steps.fetch_window.outputs.period }}

      - name: dbt build against cloud warehouse
        run: |
          pip install -r airflow/requirements.txt
          cd dbt
          cp profiles.yml.example profiles.yml  # profiles.yml is gitignored; env-driven anyway
          dbt deps
          dbt build --profiles-dir .
