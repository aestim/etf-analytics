name: Daily ETF ingest

on:
  schedule:
    - cron: '0 21 * * 1-5'  # Weekdays 21:00 UTC (after US market close)
  workflow_dispatch:

# Required for git push from Actions (Settings → Actions → Workflow permissions → Read and write)
permissions:
  contents: write

concurrency:
  group: daily-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    # Optional cloud warehouse (e.g. Neon/Supabase free Postgres).
    # Set the POSTGRES_* repo secrets to enable; leave unset for parquet-only.
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'etf_analytics' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'etf' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_SSLMODE: ${{ secrets.POSTGRES_SSLMODE || 'require' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Fetch prices (writes parquet; upserts warehouse when secrets are set)
        run: python ingest/fetch_prices.py
        env:
          RAW_DATA_DIR: data/raw
          ETF_TICKERS: SGOV,VGIT,TLT,BND,LQD,HYG,TIP,SPY,QQQ,QLD,TQQQ,VEA,SCHD,VWO,IWM,VNQ,GLD
          FETCH_PERIOD: 10y

      - name: dbt build against cloud warehouse
        if: env.POSTGRES_HOST != ''
        run: |
          pip install "dbt-core>=1.7,<2" "dbt-postgres>=1.7,<2"
          cd dbt
          cp profiles.yml.example profiles.yml  # profiles.yml is gitignored; env-driven anyway
          dbt deps
          dbt seed --profiles-dir .
          dbt run --profiles-dir .
          dbt test --profiles-dir .

      - name: Commit and push raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # data/raw/*.parquet is gitignored locally; force-add CI snapshots
          if find data/raw -name '*.parquet' | grep -q .; then
            find data/raw -name '*.parquet' -print0 | xargs -0 git add -f
          fi

          if git diff --staged --quiet; then
            echo "No raw data changes to commit"
            exit 0
          fi

          git commit -m "chore: daily ingest $(date -u +%Y-%m-%d)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
