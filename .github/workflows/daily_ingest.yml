name: Daily ETF ingest

on:
  schedule:
    - cron: '0 21 * * 1-5'  # 매일 평일 21:00 UTC = 장 마감 후
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Fetch prices
        run: python ingest/fetch_sgov_vgit.py

      - name: Commit raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          git diff --staged --quiet || git commit -m "chore: daily ingest $(date -u +%Y-%m-%d)"
          git push
