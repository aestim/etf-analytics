name: tests

# Code validation on every push / PR — scheduled ingest no longer writes Git.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ingest/requirements.txt
            dashboard/requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint — real errors only (undefined names, syntax)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run pytest
        run: pytest tests -q

  dbt_parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: airflow/requirements.txt

      - name: Install dbt
        run: pip install -r airflow/requirements.txt

      - name: dbt deps + parse (compiles models/tests, no DB connection)
        working-directory: dbt
        run: |
          cp profiles.yml.example profiles.yml
          dbt deps
          dbt parse --profiles-dir .
