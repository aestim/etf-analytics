name: tests

# Code validation on every push / PR — separate from the daily data ingest.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (analytics + qa, offline tests only)
        run: |
          pip install -r requirements-dev.txt -r ingest/requirements.txt

      - name: Lint — real errors only (undefined names, syntax)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 .

      - name: Run pytest
        run: pytest tests -q

  dbt_parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install "dbt-core>=1.7,<2" "dbt-postgres>=1.7,<2"

      - name: dbt deps + parse (compiles models/tests, no DB connection)
        working-directory: dbt
        run: |
          cp profiles.yml.example profiles.yml
          dbt deps
          dbt parse --profiles-dir .
