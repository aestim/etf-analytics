version: 2

models:
  - name: mart_etf_returns
    description: Daily simple returns by ticker
    columns:
      - name: ticker
        tests: [not_null]
      - name: price_date
        tests: [not_null]
      - name: daily_return
        description: Null on first observation per ticker

  - name: mart_etf_risk_metrics
    description: Rolling volatility and drawdown
    columns:
      - name: ticker
        tests: [not_null]
      - name: price_date
        tests: [not_null]
      - name: rolling_vol_30d
      - name: drawdown
      - name: as_of_date
        tests: [not_null]
