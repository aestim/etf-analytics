version: 2

models:
  - name: dim_etf
    description: Ticker reference dimension (one row per ETF). Join on ticker to filter or group the fact marts by asset class, sub class, or leverage.
    columns:
      - name: ticker
        description: ETF ticker symbol, uppercase — join key to mart_etf_returns and mart_etf_risk_metrics
        tests: [not_null, unique]
      - name: name
        description: Full fund name
      - name: asset_class
        description: "Broad asset class: equity, leveraged_equity, bond, real_estate, commodity"
      - name: sub_class
        description: "Finer grouping, e.g. treasury_short / treasury_long / corporate_hy / nasdaq_100_3x / us_reit / gold"
      - name: leverage
        description: Daily leverage multiple (1 = unleveraged, 2 = 2x daily, 3 = 3x daily)
      - name: description
        description: One-line plain-language summary of what the fund holds
  - name: mart_etf_returns
    description: Daily adjusted close, share volume, and simple return per ETF. One row per ticker per trading date. Use adjusted prices to recompute requested-period return, volatility, maximum drawdown, and coverage according to docs/metric-contract.md.
    columns:
      - name: ticker
        description: ETF ticker symbol, uppercase (e.g. SPY, TLT, GLD)
        tests:
          - not_null
          # Every ticker in the marts must exist in dim_etf — catches a new
          # ETF_TICKERS entry whose seeds/etf_info.csv row was forgotten.
          - relationships:
              arguments:
                to: ref('dim_etf')
                field: ticker
              config:
                severity: warn
      - name: price_date
        description: Trading session date (US market calendar)
        tests: [not_null]
      - name: adj_close
        description: Split/dividend-adjusted close price in USD
      - name: volume
        description: Daily share volume from Yahoo Finance. Use paired by ticker and price_date for descriptive volume/volatility relationship analysis; do not interpret correlation as causation.
      - name: daily_return
        description: Simple daily return, adj_close / previous adj_close - 1 (e.g. 0.01 = +1%). NULL on each ticker's first observation.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -0.75
                max_value: 0.75
              config:
                severity: warn
                where: "daily_return is not null"

  - name: mart_etf_risk_metrics
    description: Point-in-time rolling risk metrics per ETF per trading date, derived from mart_etf_returns. Use for as-of snapshots and rolling series, not requested-period volatility or maximum drawdown; those must be recomputed from filtered adjusted prices per docs/metric-contract.md.
    columns:
      - name: ticker
        description: ETF ticker symbol, uppercase
        tests: [not_null]
      - name: price_date
        description: Trading session date the metrics apply to
        tests: [not_null]
      - name: rolling_vol_30d
        description: Rolling sample standard deviation of daily returns over the last 30 trading days (daily volatility, NOT annualized; multiply by sqrt(252) to annualize). Computed over fewer days at the start of a series.
      - name: annualized_vol_30d
        description: rolling_vol_30d scaled to an annual figure (× sqrt(252)) so it matches how volatility is usually quoted. Use this for "annual/연 volatility" questions.
      - name: drawdown
        description: As-of decline from the running maximum adjusted close over all warehouse history through price_date. This peak can predate a later query window; do not use MIN(drawdown) for requested-period maximum drawdown.
      - name: as_of_date
        description: Equals price_date; retained for data-freshness checks. Prefer price_date in queries.
        tests: [not_null]
