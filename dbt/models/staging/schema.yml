version: 2

models:
  - name: stg_etf_prices
    description: Cleaned daily ETF prices (one row per ticker per date)
    columns:
      - name: ticker
        tests: [not_null]
      - name: price_date
        tests: [not_null]
      - name: adj_close
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ticker
              - price_date
